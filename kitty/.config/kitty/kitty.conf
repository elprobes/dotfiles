# Nightfox colors for Kitty
## name: nightfox
## upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/nightfox/kitty.conf

# ─── Font ───────────────────────────────────────────────────────────────────
font_family      UbuntuMono Nerd Font Mono Regular
bold_font        UbutnuMono Nerd Font Mono Bold
italic_font      UbuntuMono Nerd Font Mono Italic
bold_italic_font UbuntuMono Nerd Font Mono Bold Italic
font_size        12.5

# ─── Cursor ─────────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# ─── Window ─────────────────────────────────────────────────────────────────
background_opacity    1
window_padding_width  8
hide_window_decorations yes
enable_audio_bell     no

# ─── Scrollback ─────────────────────────────────────────────────────────────
scrollback_lines      10000
wheel_scroll_multiplier 3.0

# ─── Selection ──────────────────────────────────────────────────────────────
copy_on_select        yes

# ─── Mouse ──────────────────────────────────────────────────────────────────
mouse_hide_wait       0.5

# ─── Shell ──────────────────────────────────────────────────────────────────
#shell                 /bin/bash

# ─── Colors ─────────────────────────────────────────────────────────────────

background #121923
foreground #cdcecf
selection_background #2b3b51
selection_foreground #cdcecf
cursor_text_color #192330
url_color #81b29a

# Cursor
# uncomment for reverse background
# cursor none
cursor #cdcecf

# Border
active_border_color #719cd6
inactive_border_color #39506d
bell_border_color #f4a261

# Tabs
active_tab_background #719cd6
active_tab_foreground #131a24
inactive_tab_background #2b3b51
inactive_tab_foreground #738091

# normal
color0 #393b44
color1 #c94f6d
color2 #81b29a
color3 #dbc074
color4 #719cd6
color5 #9d79d6
color6 #63cdcf
color7 #dfdfe0

# bright
color8 #575860
color9 #d16983
color10 #8ebaa4
color11 #e0c989
color12 #86abdc
color13 #baa1e2
color14 #7ad5d6
color15 #e4e4e5

# extended colors
color16 #f4a261
color17 #d67ad2

